 spring.application.name=FlightBookingWebflux
 server.port = 9092
 
 spring.mvc.servlet.path=/api/v1/flight

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/flight_booking_db2
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA and Hibernate Configuration
# Options: none, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
